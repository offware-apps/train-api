name: Probe GTFS feeds

on:
  push:
    branches: [feeds-probe-2]

jobs:
  urls:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          curl -sSL -m 30 "https://opentransportdata.swiss/en/terms-of-use/" | sed 's/<[^>]*>/ /g' | tr -s ' \n' > t.txt; wc -c t.txt
          grep -io '.\{0,400\}\(commercial\|purpose\|open use\|restrict\).\{0,400\}' t.txt | head -20
          echo "== se licence"; curl -sSL -m 30 https://www.trafiklab.se/api/our-apis/gtfs-sverige-2/ | sed 's/<[^>]*>/ /g' | tr -s ' \n' | grep -io '.\{0,200\}\(CC0\|licen[cs]\).\{0,200\}' | head -5
          echo "== fi routes"; curl -sSL -m 120 -o fi.zip -H "Accept-Encoding: gzip" -H "Digitraffic-User: train-api/1.0" https://rata.digitraffic.fi/api/v1/trains/gtfs-passenger.zip
          unzip -p fi.zip routes.txt | awk -F, 'NR>1{split($3,a," "); print $2, $6, a[1]}' | sort | uniq -c | sort -rn | head -30
          unzip -p fi.zip trips.txt | grep -v '_9995,' | head -5
          true
