name: Probe GTFS feeds

on:
  push:
    branches: [feeds-probe-2]

jobs:
  urls:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS "https://opendata.swiss/api/3/action/package_show?id=fahrplan-2026-gtfs2020" | jq '.result | {license_title, license_id, license_url, rights: [.resources[]?.rights] | unique, res_license: [.resources[]?.license] | unique}'
          curl -sS "https://data.opentransportdata.swiss/api/3/action/package_show?id=timetable-2026-gtfs2020" | jq '.result | {license_title, license_id, license_url}' || true
          curl -sSL -o fi.zip -w "fi %{http_code} %{size_download}\n" -H "Accept-Encoding: gzip" -H "Digitraffic-User: train-api" https://rata.digitraffic.fi/api/v1/trains/gtfs-passenger.zip; unzip -l fi.zip | tail -12
          unzip -p fi.zip feed_info.txt agency.txt routes.txt 2>/dev/null | head -20
          curl -sSL -o ie.zip https://www.transportforireland.ie/transitData/Data/GTFS_Irish_Rail.zip; unzip -p ie.zip feed_info.txt agency.txt; unzip -p ie.zip routes.txt | head -20; unzip -p ie.zip trips.txt | head -3
