name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the API from the fixtures
        run: npm run build:api -- tests/fixtures/sncf-tgvmax.sample.json --gtfs renfe=tests/fixtures/gtfs-mini --gb tests/fixtures/gb-schedule.json --from 2026-10-05

  live-feeds:
    # Operator code changes are checked against the real feeds before they publish.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch
        env:
          # Feeds behind a free sign-up; each is left out while its secret isn't set.
          TRAFIKLAB_KEY: ${{ secrets.TRAFIKLAB_KEY }}
          NETWORK_RAIL_EMAIL: ${{ secrets.NETWORK_RAIL_EMAIL }}
          NETWORK_RAIL_PASSWORD: ${{ secrets.NETWORK_RAIL_PASSWORD }}
      - name: Build the API from the real feeds
        run: /usr/bin/time -f "%e s, %M KB peak memory" npm run build:api
        env:
          NODE_OPTIONS: --max-old-space-size=12288
      - name: Sizes
        run: |
          du -sh public/v1/*
          for f in public/v1/*/*/all.json; do echo "$(du -h "$f" | cut -f1) $(gzip -c "$f" | wc -c | numfmt --to=si)B gzipped  $f"; done
