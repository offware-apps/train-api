openapi: 3.1.0
info:
  title: train-api
  version: "1"
  summary: Open train timetables for rail passes (MAX JEUNE, MAX SENIOR, Interrail), one static API per operator.
  description: |
    Static JSON files on GitHub Pages, rebuilt every day from each operator's open data.
    No key, no sign-up, CORS open to every origin. A path that isn't published returns
    404 (GitHub Pages' HTML page, not JSON).

    Guide, examples, licences and the stability promise: docs/developers.md.
    The timetable files use the compact snapshot format (CompactSnapshot below).
  license:
    name: AGPL-3.0-only (code). Data keeps each source's licence, see docs/developers.md.
    identifier: AGPL-3.0-only
  contact:
    url: https://github.com/offware-apps/train-api/issues
servers:
  - url: https://offware-apps.github.io/train-api/v1
paths:
  /index.json:
    get:
      operationId: getIndex
      summary: What is published, how fresh, and each operator's passes
      responses:
        "200":
          description: The index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Index" }
  /{operator}/stations.json:
    get:
      operationId: getStations
      summary: Every station one operator's trains call at, with its URL id
      parameters:
        - $ref: "#/components/parameters/operator"
      responses:
        "200":
          description: Stations sorted by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Station" }
        "404": { $ref: "#/components/responses/NotPublished" }
  /{operator}/{pass}/all.json:
    get:
      operationId: getAllTrains
      summary: Every train bookable with one pass on one operator
      description: Can be several megabytes for the large national feeds; prefer `from/<id>.json` for a search.
      parameters:
        - $ref: "#/components/parameters/operator"
        - $ref: "#/components/parameters/pass"
      responses:
        "200":
          description: Compact snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompactSnapshot" }
        "404": { $ref: "#/components/responses/NotPublished" }
  /{operator}/{pass}/from/{stationId}.json:
    get:
      operationId: getTrainsFrom
      summary: The trains bookable with one pass that leave one station
      description: |
        A search by origin, destination and date fetches this file and filters it on the
        destination's name and the date. 404 means no bookable train leaves that station
        with that pass in the window.
      parameters:
        - $ref: "#/components/parameters/operator"
        - $ref: "#/components/parameters/pass"
        - name: stationId
          in: path
          required: true
          description: A station `id` from `/{operator}/stations.json`.
          schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
          example: paris-intramuros
      responses:
        "200":
          description: Compact snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompactSnapshot" }
        "404": { $ref: "#/components/responses/NotPublished" }
  /archive/max/{year}/{date}.json.gz:
    servers:
      - url: https://raw.githubusercontent.com/offware-apps/train-api/data
        description: The public `data` branch.
    get:
      operationId: getMaxSeatArchive
      summary: One day's MAX seat flags from the SNCF feed (gzipped JSON)
      description: Outside /v1 and outside this version's promise; see docs/archive.md.
      parameters:
        - name: year
          in: path
          required: true
          schema: { type: string, pattern: "^\\d{4}$" }
          example: "2026"
        - name: date
          in: path
          required: true
          description: The day the feed was read (UTC).
          schema: { type: string, format: date }
          example: "2026-10-06"
      responses:
        "200":
          description: Gzipped JSON. raw.githubusercontent.com serves it as a plain file, so gunzip it yourself.
          content:
            application/gzip:
              schema: { $ref: "#/components/schemas/MaxArchive" }
        "404": { $ref: "#/components/responses/NotPublished" }
components:
  parameters:
    operator:
      name: operator
      in: path
      required: true
      description: An operator `id` from index.json. New operators are added over time, so read the list from there.
      schema: { type: string, pattern: "^[a-z0-9-]+$" }
      examples:
        sncf: { value: sncf }
        renfe: { value: renfe }
        nl: { value: nl }
        de: { value: de }
        it: { value: it }
        ch: { value: ch }
        "no": { value: "no" }
        fi: { value: fi }
        ie: { value: ie }
    pass:
      name: pass
      in: path
      required: true
      description: A pass `id` listed under the operator in index.json. More passes may be added.
      schema: { type: string, pattern: "^[a-z0-9-]+$" }
      examples:
        max-jeune: { value: max-jeune }
        max-senior: { value: max-senior }
        interrail: { value: interrail }
  responses:
    NotPublished:
      description: Not published (unknown operator, pass or station, or nothing bookable). The body is an HTML page.
  schemas:
    Date:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      examples: ["2026-10-05"]
    Time:
      type: string
      description: Local time at the station, 24-hour. An arrival earlier than the departure is on the next day.
      pattern: "^\\d{2}:\\d{2}$"
      examples: ["08:00"]
    Index:
      type: object
      required: [version, updatedAt, operators]
      properties:
        version:
          const: 1
        updatedAt:
          type: string
          format: date-time
          description: When this build ran (UTC).
        operators:
          type: array
          items: { $ref: "#/components/schemas/Operator" }
    Operator:
      type: object
      required: [id, source, dates, stationCount, passes]
      properties:
        id:
          type: string
          description: Used in every path below `/v1/<id>/`.
          examples: [sncf]
        source:
          type: string
          description: The data source and its licence, for display and credit.
        dates:
          type: array
          description: Every departure date with at least one train, sorted.
          items: { $ref: "#/components/schemas/Date" }
        stationCount: { type: integer, minimum: 0 }
        passes:
          type: array
          description: Only passes with at least one bookable train are listed.
          items: { $ref: "#/components/schemas/Pass" }
    Pass:
      type: object
      required: [id, name, seatKnown, bookingUrl, trainCount]
      properties:
        id:
          type: string
          examples: [max-jeune, max-senior, interrail]
        name:
          type: string
          examples: [MAX JEUNE]
        seatKnown:
          type: boolean
          description: |
            True when the data says a seat is free (MAX: every listed train had a free MAX
            seat when the feed was read). False when no open data says (Interrail): the
            train runs, but a pass-holder seat may be sold out.
        bookingUrl: { type: string, format: uri }
        note:
          type: string
          description: Pass rules the data can't check. Show it to your users.
        trainCount:
          type: integer
          minimum: 0
          description: Bookable trains, counted once per date.
    Station:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: URL slug of the name, unique within the operator. Not shared across operators.
          examples: [paris-intramuros]
        name:
          type: string
          description: The name exactly as the operator publishes it; the compact snapshots use this.
          examples: [PARIS (intramuros)]
    CompactSnapshot:
      type: object
      description: |
        Each distinct service once, with a bitmask of the dates it runs on. Expand with
        `decodeCompact` (src/compact.ts, no imports) or the examples in docs/developers.md.
        Indexes point into this file's own `dates`, `stations` and `axes`, which differ
        from file to file.
      required: [v, dates, stations, axes, trains]
      properties:
        v:
          const: 1
        dates:
          type: array
          description: The departure dates found in this file, sorted.
          items: { $ref: "#/components/schemas/Date" }
        stations:
          type: array
          description: Station names, as in stations.json.
          items: { type: string }
        axes:
          type: array
          description: Train categories (SNCF axe, or train family such as AVE, ICE, Intercity).
          items: { type: string }
        trains:
          type: array
          items: { $ref: "#/components/schemas/CompactTrain" }
    CompactTrain:
      type: array
      description: |
        [originIdx, destinationIdx, depart, arrive, trainNo, axeIdx, dateMask].
        Clients must ignore any element after the seventh.
      prefixItems:
        - { type: integer, minimum: 0, description: Index into `stations`. }
        - { type: integer, minimum: 0, description: Index into `stations`. }
        - { $ref: "#/components/schemas/Time" }
        - { $ref: "#/components/schemas/Time" }
        - { type: string, description: Train number, or the line name when the feed has none. }
        - { type: integer, minimum: -1, description: Index into `axes`, or -1 for none. }
        - type: string
          pattern: "^[0-9a-f]*$"
          description: Hex; digit j holds dates 4j..4j+3 of `dates`, low bit first.
      minItems: 7
    MaxArchive:
      type: object
      required: [snapshot, start, days, services]
      properties:
        snapshot: { $ref: "#/components/schemas/Date" }
        start: { $ref: "#/components/schemas/Date" }
        days: { type: integer, minimum: 0 }
        services:
          type: array
          items:
            type: array
            description: "[origin, destination, trainNo, depart, flags]; flags has one character per day from `start`: 1 free MAX seat, 0 none, . not running."
            prefixItems:
              - { type: string }
              - { type: string }
              - { type: string }
              - { $ref: "#/components/schemas/Time" }
              - { type: string, pattern: "^[01.]*$" }
            minItems: 5
